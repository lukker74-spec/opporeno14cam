name: Build Reno14 FreshCam Neural APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download ESRGAN Neural Model (.tflite)
        run: |
          mkdir -p app/src/main/assets
          curl -fL "https://huggingface.co/qualcomm/ESRGAN/resolve/main/ESRGAN_lowlight.tflite" -o app/src/main/assets/esrgan.tflite || \
          curl -fL "https://huggingface.co/qualcomm/ESRGAN/resolve/main/ESRGAN.tflite" -o app/src/main/assets/esrgan.tflite || \
          curl -fL "https://storage.googleapis.com/download.tensorflow.org/models/tflite/task_library/image_segmentation/android/lite-model_deeplabv3_1_metadata_2.tflite" -o /dev/null
          if [ ! -s app/src/main/assets/esrgan.tflite ]; then
            rm -f app/src/main/assets/esrgan.tflite
          fi
          ls -lh app/src/main/assets/

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Reno14-FreshCam-Neural-APK
          path: app/build/outputs/apk/debug/app-debug.apk
