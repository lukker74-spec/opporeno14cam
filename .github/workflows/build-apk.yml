name: Build Reno14 FreshCam v8 MediaTek+Cloud APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Fast Mobile Super-Resolution TFLite Model (MediaTek NNAPI Ready)
        run: |
          mkdir -p app/src/main/assets tmp_model
          if curl -fL "https://huggingface.co/qualcomm/QuickSRNetSmall/resolve/main/QuickSRNetSmall.tflite" -o app/src/main/assets/superres.tflite && [ -s app/src/main/assets/superres.tflite ]; then
            echo "Scaricato QuickSRNetSmall.tflite (veloce per NNAPI/MediaTek)"
          elif curl -fL "https://huggingface.co/qualcomm/XLSR/resolve/main/XLSR.tflite" -o app/src/main/assets/superres.tflite && [ -s app/src/main/assets/superres.tflite ]; then
            echo "Scaricato XLSR.tflite"
          else
            curl -fL "https://www.kaggle.com/api/v1/models/kaggle/esrgan-tf2/tfLite/esrgan-tf2/1/download" -o tmp_model/model.tar.gz
            tar -xzf tmp_model/model.tar.gz -C tmp_model
            FOUND_TFLITE=$(find tmp_model -name "*.tflite" | head -n 1)
            if [ -z "$FOUND_TFLITE" ] || [ ! -s "$FOUND_TFLITE" ]; then
              echo "ERRORE: nessun file .tflite valido trovato"
              exit 1
            fi
            cp "$FOUND_TFLITE" app/src/main/assets/superres.tflite
          fi
          rm -rf tmp_model
          ls -lh app/src/main/assets/

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Reno14-FreshCam-v8-MediaTekCloud-APK
          path: app/build/outputs/apk/debug/app-debug.apk
