name: Build Reno14 FreshCam v13 StablePro APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clean legacy files
        run: |
          rm -f app/src/main/java/com/reno14/freshcam/GenerativeSuperResEngine.kt
          rm -f app/src/main/assets/superres.tflite

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Reno14-FreshCam-v13-StablePro-APK
          path: app/build/outputs/apk/debug/app-debug.apk
