name: Build Reno14 FreshCam v18 TrueLocalAI APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find Gradle project directory
        id: find_dir
        run: |
          if [ -f "settings.gradle.kts" ]; then
            echo "dir=." >> $GITHUB_OUTPUT
          elif [ -f "Reno14-FreshCam/settings.gradle.kts" ]; then
            echo "dir=Reno14-FreshCam" >> $GITHUB_OUTPUT
          else
            FOUND=$(find . -maxdepth 3 -name "settings.gradle.kts" | head -n 1)
            if [ -z "$FOUND" ]; then
              echo "ERRORE: settings.gradle.kts non trovato."
              exit 1
            fi
            echo "dir=$(dirname "$FOUND")" >> $GITHUB_OUTPUT
          fi

      - name: Clean legacy files
        working-directory: ${{ steps.find_dir.outputs.dir }}
        run: |
          rm -f app/src/main/java/com/reno14/freshcam/GenerativeSuperResEngine.kt
          rm -f app/src/main/assets/superres.tflite

      - name: Download Real ONNX Generative AI Models
        working-directory: ${{ steps.find_dir.outputs.dir }}
        run: |
          mkdir -p app/src/main/assets/models
          echo "Downloading 4x-ClearRealityV1.onnx (SPAN Photorealistic, ~1.7MB)..."
          curl -fSL --retry 3 --retry-delay 2 \
            "https://huggingface.co/huggingworld/onnx-image-models/resolve/main/4x-ClearRealityV1.onnx" \
            -o app/src/main/assets/models/4x-ClearRealityV1.onnx

          echo "Downloading realesr-general-x4v3.onnx (Real-ESRGAN v3, ~4.9MB)..."
          curl -fSL --retry 3 --retry-delay 2 \
            "https://huggingface.co/momoapps/optimix-models/resolve/main/realesr-general-x4v3.onnx" \
            -o app/src/main/assets/models/realesr-general-x4v3.onnx || \
          curl -fSL --retry 3 --retry-delay 2 \
            "https://huggingface.co/OwlMaster/AllFilesRope/resolve/main/realesr-general-x4v3.onnx" \
            -o app/src/main/assets/models/realesr-general-x4v3.onnx

          ls -lh app/src/main/assets/models/
          SPAN_SIZE=$(stat -c%s app/src/main/assets/models/4x-ClearRealityV1.onnx)
          ESR_SIZE=$(stat -c%s app/src/main/assets/models/realesr-general-x4v3.onnx)
          if [ "$SPAN_SIZE" -lt 500000 ] || [ "$ESR_SIZE" -lt 1000000 ]; then
            echo "ERRORE: Modelli ONNX scaricati non validi (dimensione troppo piccola)."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        working-directory: ${{ steps.find_dir.outputs.dir }}
        run: gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Reno14-FreshCam-v18-TrueLocalAI-APK
          path: ${{ steps.find_dir.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
